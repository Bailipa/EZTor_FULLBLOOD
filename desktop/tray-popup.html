<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZTor 弹幕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .panel {
    width: 292px;
    margin: 4px;
    background: #17171f;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 14px 10px;
    color: #e5e7eb;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header .title { font-size: 13px; font-weight: 600; color: #f3f4f6; }
  .header .hint { font-size: 10px; color: #6b7280; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px; }
  .row .label { font-size: 12px; color: #e5e7eb; }
  .sep { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }
  .group { padding: 6px 2px; }
  .group-label { font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button {
    flex: 1;
    min-width: 0;
    padding: 5px 0;
    font-size: 11px;
    color: #d1d5db;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .seg button:hover { background: rgba(255,255,255,0.1); }
  .seg button.active {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  .footer { display: flex; gap: 6px; margin-top: 10px; }
  .footer button {
    flex: 1;
    padding: 7px 0;
    font-size: 12px;
    color: #d1d5db;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .footer button:hover { background: rgba(255,255,255,0.08); }
  .footer button.quit { color: #f87171; border-color: rgba(248,113,113,0.3); }
  .footer button.quit:hover { background: rgba(248,113,113,0.12); }
  /* 开关 */
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255,255,255,0.15); transition: background 0.15s;
  }
  .switch .track::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .switch input:checked + .track { background: #2563eb; }
  .switch input:checked + .track::before { transform: translateX(14px); }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <span class="title">弹幕</span>
      <span class="hint">点击空白处收起</span>
    </div>
    <div class="row">
      <span class="label">全局弹幕</span>
      <label class="switch">
        <input type="checkbox" id="overlay" />
        <span class="track"></span>
      </label>
    </div>
    <div class="sep"></div>
    <div id="groups"></div>
    <div class="footer">
      <button id="open-app">打开设置面板</button>
      <button id="quit-app" class="quit">退出</button>
    </div>
  </div>
<script>
  ;(function () {
    var trayPopup = window.trayPopup
    if (!trayPopup) return

    var GROUPS = {
      speed: { label: '速度', options: [0.5, 0.75, 1, 1.5, 2], fmt: function (v) { return v + 'x' } },
      amount: { label: '单词量', options: [0.5, 1, 1.5, 2], fmt: function (v) { return v + 'x' } },
      opacity: { label: '不透明度', options: [20, 50, 80, 100], fmt: function (v) { return v + '%' } },
      size: { label: '大小', options: [0.5, 1, 1.5, 2], fmt: function (v) { return v + 'x' } },
    }
    var state = { overlay: false, settings: { speed: 1, amount: 1, opacity: 80, size: 1 } }

    function buildGroups() {
      var groups = document.getElementById('groups')
      Object.keys(GROUPS).forEach(function (key) {
        var g = GROUPS[key]
        var row = document.createElement('div')
        row.className = 'group'
        var label = document.createElement('div')
        label.className = 'group-label'
        label.textContent = g.label
        var seg = document.createElement('div')
        seg.className = 'seg'
        g.options.forEach(function (v) {
          var btn = document.createElement('button')
          btn.textContent = g.fmt(v)
          btn.dataset.key = key
          btn.dataset.value = v
          btn.addEventListener('click', function () { trayPopup.applySetting(key, v) })
          seg.appendChild(btn)
        })
        row.appendChild(label)
        row.appendChild(seg)
        groups.appendChild(row)
      })
    }

    function render() {
      document.getElementById('overlay').checked = state.overlay
      Object.keys(GROUPS).forEach(function (key) {
        var buttons = document.querySelectorAll('.seg button[data-key="' + key + '"]')
        for (var i = 0; i < buttons.length; i++) {
          var active = Number(buttons[i].dataset.value) === state.settings[key]
          buttons[i].classList.toggle('active', active)
        }
      })
    }

    document.getElementById('overlay').addEventListener('change', function (e) {
      trayPopup.setOverlay(e.target.checked)
    })
    document.getElementById('open-app').addEventListener('click', function () {
      trayPopup.openApp()
    })
    document.getElementById('quit-app').addEventListener('click', function () {
      trayPopup.quit()
    })

    trayPopup.getState().then(function (s) {
      if (!s) return
      state.overlay = !!s.overlayVisible
      state.settings = Object.assign(state.settings, s.settings || {})
      render()
    }).catch(function () {})

    trayPopup.onChanged(function (msg) {
      if (msg.type === 'overlay') state.overlay = !!msg.enabled
      else if (msg.type === 'setting') state.settings[msg.key] = msg.value
      render()
    })

    buildGroups()
    render()
  })()
</script>
</body>
</html>
