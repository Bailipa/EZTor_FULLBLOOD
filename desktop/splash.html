<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #1a0a2e 0%, #0a0a0f 60%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #fff; overflow: hidden;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px; }
  .title { margin-top: 18px; font-size: 20px; font-weight: 700; letter-spacing: .12em; }
  .sub { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.5); }
  .bar { margin-top: 22px; width: 160px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: linear-gradient(90deg,#7c3aed,#0891b2); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(400%);} }
</style>
</head>
<body>
  <img class="logo" src="icons/icon-512.png" alt="EZTor" />
  <div class="title">EZTor</div>
  <div class="sub">正在加载…</div>
  <div class="bar"><i></i></div>
</body>
</html>
